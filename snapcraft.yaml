name: bitcoinz-blue
base: core22
version: '1.1.0'
summary: BitcoinZ Blue - A modern light wallet for BitcoinZ
description: |
  BitcoinZ Blue is a legitimate, open-source light wallet for the BitcoinZ
  cryptocurrency (BTCZ). This is a non-custodial wallet that gives users full
  control over their private keys and funds.

  SECURITY & LEGITIMACY:
  - Open source code available at: https://github.com/z-bitcoinz/BitcoinZ_Blue
  - MIT License - fully transparent development
  - Community-driven project with public development
  - No data collection or tracking
  - Private keys never leave user's device
  - Strict confinement with minimal required permissions

  FEATURES:
  - Shielded (private) and transparent transactions
  - Fast sync with light wallet technology
  - Modern, user-friendly interface
  - Cross-platform compatibility
  - Secure local key storage

  NETWORK USAGE:
  - Connects only to legitimate BitcoinZ light wallet servers
  - Uses standard Zcash protocol (BitcoinZ is Zcash fork)
  - No mining, no suspicious network activity
  - Read-only blockchain synchronization

  BitcoinZ is an established cryptocurrency (launched 2017) focused on privacy,
  security, and community governance. This wallet provides a secure way to
  store, send, and receive BTCZ while maintaining user privacy and security.

  For support: https://github.com/z-bitcoinz/BitcoinZ_Blue/issues

grade: stable
confinement: strict

icon: resources/icon.png

architectures:
  - build-on: amd64
    build-for: amd64

apps:
  bitcoinz-blue:
    command: bitcoinz-wallet-lite
    desktop: usr/share/applications/bitcoinz-blue.desktop
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - home
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - audio-playback
      - unity7
      - browser-support
      - gsettings
      - removable-media
    environment:
      DISABLE_WAYLAND: 1
      TMPDIR: $XDG_RUNTIME_DIR

parts:
  bitcoinz-blue:
    plugin: dump
    source: dist/linux-unpacked/
    stage-packages:
      - libgtk-3-0
      - libnotify4
      - libnss3
      - libxss1
      - libxtst6
      - libatspi2.0-0
      - libuuid1
      - libsecret-1-0
      - libgconf-2-4
      - libdrm2
      - libxcomposite1
      - libxdamage1
      - libxrandr2
      - libgbm1
      - libxkbcommon0
      - libxkbfile1
      - libasound2
    organize:
      '*': usr/lib/bitcoinz-blue/
    override-build: |
      craftctl default

      # Create desktop file
      mkdir -p $CRAFT_PART_INSTALL/usr/share/applications
      cat > $CRAFT_PART_INSTALL/usr/share/applications/bitcoinz-blue.desktop << 'EOF'
[Desktop Entry]
Name=BitcoinZ Blue
Comment=A modern light wallet for BitcoinZ
GenericName=Cryptocurrency Wallet
Exec=bitcoinz-blue
Icon=${SNAP}/usr/share/pixmaps/bitcoinz-blue.png
Type=Application
StartupNotify=true
Categories=Office;Finance;
Keywords=bitcoin;cryptocurrency;wallet;btcz;bitcoinz;blockchain;
MimeType=x-scheme-handler/bitcoinz;
StartupWMClass=bitcoinz-wallet-lite
EOF

      # Create launcher script
      mkdir -p $CRAFT_PART_INSTALL/bin
      cat > $CRAFT_PART_INSTALL/bin/bitcoinz-wallet-lite << 'EOF'
#!/bin/bash
export LD_LIBRARY_PATH="$SNAP/usr/lib/bitcoinz-blue:$LD_LIBRARY_PATH"
export PATH="$SNAP/usr/lib/bitcoinz-blue:$PATH"
cd "$SNAP/usr/lib/bitcoinz-blue"
exec "$SNAP/usr/lib/bitcoinz-blue/bitcoinz-wallet-lite" "$@"
EOF
      chmod +x $CRAFT_PART_INSTALL/bin/bitcoinz-wallet-lite

      # Copy icon
      mkdir -p $CRAFT_PART_INSTALL/usr/share/pixmaps
      if [ -f "resources/icon.png" ]; then
        cp "resources/icon.png" $CRAFT_PART_INSTALL/usr/share/pixmaps/bitcoinz-blue.png
      elif [ -f "../resources/icon.png" ]; then
        cp "../resources/icon.png" $CRAFT_PART_INSTALL/usr/share/pixmaps/bitcoinz-blue.png
      fi

  desktop-integration:
    plugin: nil
    stage-packages:
      - desktop-file-utils
    override-build: |
      craftctl default
      # Update desktop database
      update-desktop-database $CRAFT_PART_INSTALL/usr/share/applications || true

layout:
  /usr/lib/bitcoinz-blue:
    bind: $SNAP/usr/lib/bitcoinz-blue
  /usr/share/applications:
    bind: $SNAP/usr/share/applications

# Store metadata
contact: https://github.com/z-bitcoinz/BitcoinZ_Blue/issues
issues: https://github.com/z-bitcoinz/BitcoinZ_Blue/issues
source-code: https://github.com/z-bitcoinz/BitcoinZ_Blue
website: https://getbtcz.com
license: MIT

# Snap store specific
adopt-info: bitcoinz-blue
