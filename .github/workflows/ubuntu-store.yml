name: Ubuntu Store Submission

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release channel'
        required: true
        default: 'edge'
        type: choice
        options:
          - edge
          - beta
          - candidate
          - stable
      force_upload:
        description: 'Force upload even if version exists'
        required: false
        default: false
        type: boolean

env:
  RUSTFLAGS: "-A warnings"

jobs:
  build-snap:
    runs-on: ubuntu-latest
    outputs:
      snap-file: ${{ steps.build.outputs.snap-file }}
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building version: $VERSION"
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'yarn'
          
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.81
          override: true
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3-dev \
            libxss1 \
            libxtst6 \
            libatspi2.0-0 \
            libuuid1 \
            libsecret-1-dev \
            build-essential \
            libasound2-dev \
            snapd

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build native modules
        working-directory: ./
        run: yarn neon

      - name: Build Electron app
        run: yarn dist:linux
        
      - name: Verify Linux build
        run: |
          if [ ! -d "dist/linux-unpacked" ]; then
            echo "❌ Linux build failed - dist/linux-unpacked not found"
            exit 1
          fi
          echo "✅ Linux build successful"
          ls -la dist/
          
      - name: Install Snapcraft
        run: |
          sudo snap install snapcraft --classic
          sudo snap install lxd --channel=latest/stable
          sudo lxd init --auto
          sudo usermod -a -G lxd $USER

      - name: Build Snap package
        id: build
        run: |
          echo "🔨 Building Snap package..."

          # Use snapcraft with --use-lxd flag for GitHub Actions
          sg lxd -c 'snapcraft --use-lxd --verbose'

          # Find the generated snap file
          SNAP_FILE=$(ls *.snap | head -1)
          if [ -z "$SNAP_FILE" ]; then
            echo "❌ No snap file found"
            exit 1
          fi

          echo "✅ Snap built: $SNAP_FILE"
          echo "snap-file=$SNAP_FILE" >> $GITHUB_OUTPUT

          # Verify snap info
          snap info "$SNAP_FILE" || true
          
      - name: Test Snap package
        run: |
          SNAP_FILE="${{ steps.build.outputs.snap-file }}"
          echo "🧪 Testing Snap package: $SNAP_FILE"
          
          # Install in devmode for testing
          sudo snap install "$SNAP_FILE" --dangerous --devmode
          
          # Check if installed
          if snap list | grep -q bitcoinz-blue; then
            echo "✅ Snap installed successfully"
            snap list bitcoinz-blue
          else
            echo "❌ Snap installation failed"
            exit 1
          fi
          
          # Remove test installation
          sudo snap remove bitcoinz-blue
          echo "✅ Test completed"
          
      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitcoinz-blue-snap
          path: ${{ steps.build.outputs.snap-file }}
          retention-days: 30

  submit-to-store:
    needs: build-snap
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download Snap artifact
        uses: actions/download-artifact@v4
        with:
          name: bitcoinz-blue-snap
          
      - name: Install Snapcraft
        run: |
          sudo snap install snapcraft --classic
          
      - name: Login to Snapcraft
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "❌ SNAPCRAFT_STORE_CREDENTIALS secret not set"
            echo "Please set up store credentials first"
            exit 1
          fi
          
          echo "$SNAPCRAFT_STORE_CREDENTIALS" | snapcraft login --with -
          echo "✅ Logged in to Snapcraft"
          
      - name: Upload to Ubuntu Store
        env:
          SNAP_FILE: ${{ needs.build-snap.outputs.snap-file }}
          VERSION: ${{ needs.build-snap.outputs.version }}
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || 'edge' }}
          FORCE_UPLOAD: ${{ github.event.inputs.force_upload || 'false' }}
        run: |
          echo "📤 Uploading $SNAP_FILE to $RELEASE_CHANNEL channel..."
          
          # Check if this version already exists
          if [ "$FORCE_UPLOAD" != "true" ]; then
            if snapcraft list-revisions bitcoinz-blue | grep -q "$VERSION"; then
              echo "⚠️  Version $VERSION already exists in store"
              echo "Use force_upload=true to override"
              exit 1
            fi
          fi
          
          # Upload the snap
          snapcraft upload "$SNAP_FILE"
          
          echo "✅ Upload completed"
          
      - name: Release to channel
        env:
          VERSION: ${{ needs.build-snap.outputs.version }}
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || 'edge' }}
        run: |
          echo "🚀 Releasing version $VERSION to $RELEASE_CHANNEL channel..."
          
          # Get the revision number from the upload
          REVISION=$(snapcraft list-revisions bitcoinz-blue | grep "$VERSION" | head -1 | awk '{print $1}')
          
          if [ -z "$REVISION" ]; then
            echo "❌ Could not find revision for version $VERSION"
            exit 1
          fi
          
          echo "📋 Found revision: $REVISION"
          
          # Release to the specified channel
          snapcraft release bitcoinz-blue "$REVISION" "$RELEASE_CHANNEL"
          
          echo "✅ Released revision $REVISION to $RELEASE_CHANNEL channel"
          
      - name: Store submission summary
        env:
          VERSION: ${{ needs.build-snap.outputs.version }}
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || 'edge' }}
          SNAP_FILE: ${{ needs.build-snap.outputs.snap-file }}
        run: |
          echo "🎉 Ubuntu Store Submission Complete!"
          echo "=================================="
          echo "📦 Package: $SNAP_FILE"
          echo "🏷️  Version: $VERSION"
          echo "📺 Channel: $RELEASE_CHANNEL"
          echo "🔗 Store URL: https://snapcraft.io/bitcoinz-blue"
          echo ""
          echo "📋 Next steps:"
          echo "1. Monitor store review process"
          echo "2. Update store listing if needed"
          echo "3. Promote to stable when ready"
          echo "4. Announce to community"

  notify-success:
    needs: [build-snap, submit-to-store]
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Create release summary
        env:
          VERSION: ${{ needs.build-snap.outputs.version }}
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || 'edge' }}
        run: |
          cat > release-summary.md << EOF
          # 🎉 BitcoinZ Blue v$VERSION - Ubuntu Store Release
          
          ## ✅ Successfully submitted to Ubuntu Store
          
          - **Version**: $VERSION
          - **Channel**: $RELEASE_CHANNEL
          - **Store URL**: https://snapcraft.io/bitcoinz-blue
          - **Installation**: \`sudo snap install bitcoinz-blue --$RELEASE_CHANNEL\`
          
          ## 📋 Store Status
          
          The app has been uploaded and is now available on the $RELEASE_CHANNEL channel.
          
          ## 🚀 Next Steps
          
          1. **Monitor Reviews**: Check for any store review feedback
          2. **Test Installation**: Verify the snap works correctly
          3. **Update Listing**: Add screenshots and improve description
          4. **Promote to Stable**: When ready for general release
          5. **Community Announcement**: Share with BitcoinZ community
          
          ## 📞 Support
          
          - **Issues**: https://github.com/z-bitcoinz/BitcoinZ_Blue/issues
          - **Community**: BitcoinZ Discord
          - **Store**: https://snapcraft.io/bitcoinz-blue
          EOF
          
          echo "📄 Release summary created"
          cat release-summary.md
