name: Ubuntu Store Submission

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release channel'
        required: true
        default: 'edge'
        type: choice
        options:
          - edge
          - beta
          - candidate
          - stable

env:
  RUSTFLAGS: "-A warnings -A unused-imports -A unused-mut -A unused-variables -A dead-code"

jobs:
  create-snap:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Creating snap for version: $VERSION"
          
      - name: Check if we should build from source
        id: check_deb
        run: |
          echo "deb_exists=false" >> $GITHUB_OUTPUT
          echo "📦 Building snap from source (no DEB artifact dependency)"
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'yarn'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.81
          cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3-dev libxss1 libxtst6 libatspi2.0-0 libuuid1 libsecret-1-dev build-essential libasound2-dev

      - name: Build from source
        run: |
          # Remove package-lock.json to avoid conflicts
          rm -f package-lock.json

          # Retry yarn install with exponential backoff
          for i in {1..3}; do
            echo "Attempt $i: Installing dependencies..."
            if yarn install --frozen-lockfile --network-timeout 300000; then
              echo "✅ Dependencies installed successfully"
              break
            else
              echo "❌ Attempt $i failed, waiting before retry..."
              sleep $((i * 30))
              if [ $i -eq 3 ]; then
                echo "🔄 Trying with npm instead..."
                npm install --frozen-lockfile
              fi
            fi
          done

          rustc --version
          cargo --version
          yarn neon
          yarn dist:linux
          
      - name: Create snap structure
        run: |
          mkdir -p snap-build/usr/lib/bitcoinz-blue
          cp -r dist/linux-unpacked/* snap-build/usr/lib/bitcoinz-blue/
          echo "✅ Snap structure created from Linux build"
          
      - name: Create launcher script
        run: |
          mkdir -p snap-build/bin
          echo '#!/bin/bash' > snap-build/bin/bitcoinz-blue
          echo 'MAIN_EXEC=$(find $SNAP -name "bitcoinz-wallet-lite" -type f | head -1)' >> snap-build/bin/bitcoinz-blue
          echo 'if [ -z "$MAIN_EXEC" ]; then' >> snap-build/bin/bitcoinz-blue
          echo '  MAIN_EXEC=$(find $SNAP -name "*bitcoinz*" -type f -executable | head -1)' >> snap-build/bin/bitcoinz-blue
          echo 'fi' >> snap-build/bin/bitcoinz-blue
          echo 'if [ -n "$MAIN_EXEC" ]; then' >> snap-build/bin/bitcoinz-blue
          echo '  exec "$MAIN_EXEC" "$@"' >> snap-build/bin/bitcoinz-blue
          echo 'else' >> snap-build/bin/bitcoinz-blue
          echo '  echo "Error: Could not find BitcoinZ Blue executable"' >> snap-build/bin/bitcoinz-blue
          echo '  exit 1' >> snap-build/bin/bitcoinz-blue
          echo 'fi' >> snap-build/bin/bitcoinz-blue
          chmod +x snap-build/bin/bitcoinz-blue
          
      - name: Create desktop file
        run: |
          mkdir -p snap-build/usr/share/applications
          echo '[Desktop Entry]' > snap-build/usr/share/applications/bitcoinz-blue.desktop
          echo 'Name=BitcoinZ Blue' >> snap-build/usr/share/applications/bitcoinz-blue.desktop
          echo 'Comment=A modern light wallet for BitcoinZ' >> snap-build/usr/share/applications/bitcoinz-blue.desktop
          echo 'GenericName=Cryptocurrency Wallet' >> snap-build/usr/share/applications/bitcoinz-blue.desktop
          echo 'Exec=bitcoinz-blue' >> snap-build/usr/share/applications/bitcoinz-blue.desktop
          echo 'Icon=${SNAP}/usr/share/pixmaps/bitcoinz-blue.png' >> snap-build/usr/share/applications/bitcoinz-blue.desktop
          echo 'Type=Application' >> snap-build/usr/share/applications/bitcoinz-blue.desktop
          echo 'StartupNotify=true' >> snap-build/usr/share/applications/bitcoinz-blue.desktop
          echo 'Categories=Office;Finance;' >> snap-build/usr/share/applications/bitcoinz-blue.desktop
          echo 'Keywords=bitcoin;cryptocurrency;wallet;btcz;bitcoinz;blockchain;' >> snap-build/usr/share/applications/bitcoinz-blue.desktop
          echo 'MimeType=x-scheme-handler/bitcoinz;' >> snap-build/usr/share/applications/bitcoinz-blue.desktop
          echo 'StartupWMClass=bitcoinz-wallet-lite' >> snap-build/usr/share/applications/bitcoinz-blue.desktop
          
      - name: Copy icon
        run: |
          mkdir -p snap-build/usr/share/pixmaps
          if [ -f "resources/icon.png" ]; then
            cp resources/icon.png snap-build/usr/share/pixmaps/bitcoinz-blue.png
          fi
          

          
      - name: Install snap tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools

      - name: Create snap manually
        run: |
          cd snap-build

          # Create meta directory
          mkdir -p meta

          # Create snap.yaml
          cat > meta/snap.yaml << 'SNAP_YAML'
          name: simbav911-bitcoinz-blue
          version: '${{ steps.version.outputs.version }}'
          summary: BitcoinZ Blue - A modern light wallet for BitcoinZ
          description: |
            BitcoinZ Blue is a lightweight, secure wallet for the BitcoinZ cryptocurrency.

            Features:
            - Shielded (private) and transparent transactions
            - Fast sync with light wallet technology
            - Modern, user-friendly interface
            - Cross-platform compatibility
            - Open source and community-driven

          grade: stable
          confinement: devmode
          base: core22

          architectures:
            - amd64

          apps:
            bitcoinz-blue:
              command: bin/bitcoinz-blue
              plugs:
                - network
                - network-bind
                - home
                - desktop
                - desktop-legacy
                - wayland
                - x11
                - opengl
                - audio-playback
                - unity7
                - browser-support
                - gsettings
                - removable-media
          SNAP_YAML

          # Create the snap package manually
          mksquashfs . ../simbav911-bitcoinz-blue_${{ steps.version.outputs.version }}_amd64.snap -noappend -comp xz -no-xattrs -no-fragments

          echo "✅ Snap package created manually"
          ls -la ../simbav911-bitcoinz-blue_*.snap
          
      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: simbav911-bitcoinz-blue-snap
          path: "*.snap"
          retention-days: 30
          
      - name: Check for store credentials
        id: check_credentials
        run: |
          if [ -n "${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
          fi

      - name: Install snapcraft for store operations
        if: steps.check_credentials.outputs.has_credentials == 'true'
        run: |
          sudo snap install snapcraft --classic

      - name: Verify Snapcraft credentials
        if: steps.check_credentials.outputs.has_credentials == 'true'
        working-directory: /tmp
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: echo "✅ Snapcraft credentials are set and ready for upload"

      - name: Upload to Ubuntu Store
        if: steps.check_credentials.outputs.has_credentials == 'true'
        working-directory: /tmp
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          SNAP_FILE=$(ls $GITHUB_WORKSPACE/*.snap | head -1)
          snapcraft upload "$SNAP_FILE"
          REVISION=$(snapcraft list-revisions simbav911-bitcoinz-blue | grep "$VERSION" | head -1 | awk '{print $1}')
          if [ -n "$REVISION" ]; then
            snapcraft release simbav911-bitcoinz-blue "$REVISION" "$RELEASE_CHANNEL"
          fi
          
      - name: Summary (with store upload)
        if: steps.check_credentials.outputs.has_credentials == 'true'
        run: |
          SNAP_FILE=$(ls *.snap | head -1)
          echo "🎉 Snap package created and uploaded: $SNAP_FILE"
          echo "📦 Version: ${{ steps.version.outputs.version }}"
          echo "📺 Channel: ${{ github.event.inputs.release_channel }}"
          echo "✅ Uploaded to Ubuntu Store"
          echo "🔗 https://snapcraft.io/simbav911-bitcoinz-blue"
          echo "📥 Install: sudo snap install simbav911-bitcoinz-blue --${{ github.event.inputs.release_channel }}"

      - name: Summary (artifact only)
        if: steps.check_credentials.outputs.has_credentials == 'false'
        run: |
          SNAP_FILE=$(ls *.snap | head -1)
          echo "🎉 Snap package created: $SNAP_FILE"
          echo "📦 Version: ${{ steps.version.outputs.version }}"
          echo "📺 Channel: ${{ github.event.inputs.release_channel }}"
          echo "⚠️ No store credentials - snap available as artifact"
          echo "📥 Download artifact and test: sudo snap install $SNAP_FILE --dangerous --devmode"
          echo "💡 Add SNAPCRAFT_STORE_CREDENTIALS secret to enable store upload"
